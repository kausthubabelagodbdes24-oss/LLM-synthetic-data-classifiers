# Experiment settings — shared config (changes need approval from all three).

tasks: [trec, rotten_tomatoes, sst5, emotion]
seeds: [13, 42, 7]

n_train: 1000                   # training examples per run (C1-C4)
example_pool_frac: 0.10         # share of the train split held out as the few-shot example pool
low_resource_per_class: 10      # C5a: real examples per class

embedding_model: sentence-transformers/all-mpnet-base-v2   # classifier features (Reimers & Gurevych 2019)
diversity_model: sentence-transformers/all-MiniLM-L6-v2    # diversity / faithfulness metrics (as in Li et al.)

classifier:
  type: logreg
  C: 1.0
  max_iter: 2000

# Run matrix. `real_share` is the fraction of the C1 real sample kept;
# the rest of each label's count is filled from `synthetic`.
conditions:
  C1:   {kind: mix, real_share: 1.0, synthetic: null}
  C2:   {kind: mix, real_share: 0.0, synthetic: zero_shot}
  C3:   {kind: mix, real_share: 0.0, synthetic: few_shot}
  C4a:  {kind: mix, real_share: 0.75, synthetic: few_shot}
  C4b:  {kind: mix, real_share: 0.50, synthetic: few_shot}
  C4c:  {kind: mix, real_share: 0.25, synthetic: few_shot}
  C5a:  {kind: lowres, add: null}
  C5b:  {kind: lowres, add: auggpt}
  C5c:  {kind: lowres, add: few_shot_matched}
  CEIL: {kind: full}

annotation:
  items_per_task: 40
  sample_seed: 0
