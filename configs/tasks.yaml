# Task registry — shared config (changes need approval from all three).
#
# Every file in the project stores labels as the string NAMES below
# (never the dataset's integer ids). prepare_data.py maps the raw dataset
# labels onto these names using `label_map` (exact match) or `label_contains`
# (case-insensitive substring match).
#
# `description` and `style` are inserted into the generation prompts, so
# write them the way you would explain the task to a person.

tasks:
  trec:
    title: Question type (TREC-6)
    hf_id: SetFit/TREC-QC
    hf_config: null
    train_split: train
    test_split: test
    text_field: text
    label_field: label_coarse_text
    label_contains:            # substring of the raw label -> our label name
      abbreviation: abbreviation
      entit: entity
      description: description
      human: human
      location: location
      numeric: numeric
    expected_subjectivity: low
    task_context: >-
      a dataset of English questions labelled by the type of answer they expect
    style: a short, natural English question, the kind people type into a search box
    max_words: 20
    labels:
      abbreviation: asks what an abbreviation or acronym stands for, or for the abbreviation of something
      entity: answer is a thing such as an animal, food, product, colour, event, sport, language or term
      description: asks for a definition, a description, an explanation, a reason or how something is done
      human: answer is a person, a group of people, an organisation or a title
      location: answer is a place such as a city, country, mountain, river or address
      numeric: answer is a number such as a date, count, distance, price, percentage, size or duration

  rotten_tomatoes:
    title: Binary sentiment (Rotten Tomatoes)
    hf_id: cornell-movie-review-data/rotten_tomatoes
    hf_config: null
    train_split: train
    test_split: test
    text_field: text
    label_field: label
    label_map: {0: negative, 1: positive}
    expected_subjectivity: medium
    task_context: >-
      a dataset of single sentences taken from film critics' reviews, labelled by sentiment
    style: one sentence from a professional film critic's review, lower-cased, no film title needed
    max_words: 35
    labels:
      negative: the critic's opinion of the film is negative
      positive: the critic's opinion of the film is positive

  sst5:
    title: Fine-grained sentiment (SST-5)
    hf_id: SetFit/sst5
    hf_config: null
    train_split: train
    test_split: test
    text_field: text
    label_field: label
    label_map: {0: very_negative, 1: negative, 2: neutral, 3: positive, 4: very_positive}
    expected_subjectivity: high
    task_context: >-
      a dataset of single sentences from film reviews, labelled on a five-point sentiment scale
    style: one sentence from a professional film critic's review, lower-cased, no film title needed
    max_words: 35
    labels:
      very_negative: strongly negative opinion of the film
      negative: mildly or moderately negative opinion of the film
      neutral: neither positive nor negative, or evenly mixed
      positive: mildly or moderately positive opinion of the film
      very_positive: strongly positive opinion of the film

  emotion:
    title: Emotion (dair-ai/emotion)
    hf_id: dair-ai/emotion
    hf_config: split
    train_split: train
    test_split: test
    text_field: text
    label_field: label
    label_map: {0: sadness, 1: joy, 2: love, 3: anger, 4: fear, 5: surprise}
    expected_subjectivity: high
    task_context: >-
      a dataset of short English tweets labelled by the main emotion the writer expresses
    style: a short first-person English tweet, lower-case, no hashtags, no emojis, often starting with "i feel" or "i am"
    max_words: 30
    labels:
      sadness: the writer feels sad, lonely, hurt or low
      joy: the writer feels happy, content, glad or excited
      love: the writer feels love, affection, tenderness or longing for someone or something
      anger: the writer feels angry, irritated, resentful or annoyed
      fear: the writer feels afraid, anxious, nervous or worried
      surprise: the writer feels surprised, amazed, shocked or curious
