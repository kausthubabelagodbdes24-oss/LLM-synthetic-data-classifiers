name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-ci.txt
      - name: Contract checks and tests (offline embedder, fake LLM)
        env:
          SYNTHTEXT_EMBEDDER: hashing
        run: pytest
